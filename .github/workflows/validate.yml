name: Terraform Validation CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Lint & Validate HCL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Initialize & Validate Root Module
        run: |
          terraform init -backend=false
          terraform validate

      - name: Initialize & Validate Modules & Examples
        run: |
          for dir in modules/resource-group modules/storage-account examples/multi-environment-calling; do
            if [ -d "$dir" ]; then
              echo "Validating: $dir..."
              (cd "$dir" && terraform init -backend=false && terraform validate)
            fi
          done
